[project]
name = "akusento"
version = "0.1.0"
description = "Open Japanese pitch-accent scorer and accent-controllable TTS"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "torch>=2.0",
  "pyopenjtalk>=0.3",
  "pyworld>=0.3",
  "librosa>=0.10",
  "transformers>=4.40",
  "datasets>=2.0",
  "huggingface_hub>=0.20",
  "matplotlib>=3.8",
  "typer>=0.9",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
akusento = "akusento.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
